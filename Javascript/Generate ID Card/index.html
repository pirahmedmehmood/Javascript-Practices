<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate ID Card</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <body>

  <div class="formBox">
    <h2>Generate ID Card</h2>
    <form onsubmit="saveData(event)">
      <label>Full Name:</label>
      <input type="text" id="name" placeholder="Enter name">
      <label>Email:</label>
      <input type="email" id="email" placeholder="Enter email">
      <label>Course:</label>
      <input type="text" id="course" placeholder="Enter course">
      <label>Roll Number:</label>
      <input type="text" id="roll" placeholder="Enter roll number">
      <label>Batch:</label>
      <input type="text" id="batch" placeholder="Enter batch number">
      <label>Upload Image:</label>
      <input type="file" id="image">
      <button type="submit">Generate</button>
    </form>
  </div>

  <div class="idCard" id="cardBox">
    <img src="" alt="Profile Picture" id="cardImage">
    <div class="info">
      <p><strong>Name:</strong> <span id="cardName">---</span></p>
      <p><strong>Email:</strong> <span id="cardEmail">---</span></p>
      <p><strong>Course:</strong> <span id="cardCourse">---</span></p>
      <p><strong>Roll No:</strong> <span id="cardRoll">---</span></p>
      <p><strong>Batch:</strong> <span id="cardBatch">---</span></p>
    </div>
  </div>
    <script src="app.js"></script>
</body>
</html>
