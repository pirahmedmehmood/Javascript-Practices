<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="box">
    <h2 id="question"></h2>

    <button class="btn" onclick="checkAns(0)" id="opton1"></button>

    <button class="btn" onclick="checkAns(1)" id="opton2"></button>

    <button class="btn" onclick="checkAns(2)" id="opton3"></button>

    <button class="btn" onclick="checkAns(3)" id="opton4"></button>

    <p id="message"></p>
    <p id="Score"></p>
    <button class="back" id="bacto"></button>

    <button id="nextBtn" onclick="nextQuestion()">Next</button>
</div>
    
    <script src="app.js"></script>
</body>
</html>
