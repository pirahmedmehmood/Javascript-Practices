<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store UI</title>
    <style>
        body {
            margin: 0;
            padding: 25px;
            background: #eef1f5;
            font-family: "Segoe UI", sans-serif;
        }

        .heading {
            text-align: center;
            font-size: 32px;
            margin-bottom: 25px;
            color: #222;
        }

        .grid-box {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: #fff;
            border-radius: 10px;
            padding: 18px;
            border: 1px solid #d8dde3;
            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0px 6px 20px rgba(0,0,0,0.12);
        }

        .product-title {
            font-size: 20px;
            color: #0a74e6;
            margin-bottom: 12px;
        }

        .entry {
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .entry .label {
            font-weight: 600;
            color: #333;
        }
    </style>
</head>
<body>

    <h1 class="heading">Store Categories</h1>
    <div id="root" class="grid-box"></div>

    <script src="app.js"></script>
</body>
</html>
